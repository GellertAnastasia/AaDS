name: General CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-and-test-ascii85:
    if: |
      (github.event_name == 'pull_request' && github.ref == 'refs/heads/ascii85') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ascii85')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libgtest-dev 
      - name: Build main program
        run: |
          cd ascii85
          make ascii85
      - name: Build and run tests
        run: |
          cd ascii85
          make test

  build-and-test-gauss:
    if: |
      (github.event_name == 'pull_request' && github.ref == 'refs/heads/gauss') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/gauss')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libgtest-dev
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Build main program
        run: |
          cd gauss
          make gauss
      - name: Build and run tests
        run: |
          cd gauss
          make test
